<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlayBox Admin</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1b1030; background: #f6f3ff; }
      body { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
      h1 { margin: 0 0 4px; }
      p.sub { margin: 0 0 24px; color: #6b6290; }
      .card { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(40,20,90,.08); }
      .game { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #eee; }
      .game:last-child { border-bottom: none; }
      .game .info { flex: 1; min-width: 0; }
      .game .info b { display: block; }
      .game .info small { color: #6b6290; }
      button { font: inherit; border: none; border-radius: 8px; padding: 8px 12px; cursor: pointer; background: #ece7ff; }
      button.danger { background: #ffe1e6; color: #a1122d; }
      .switch { display: flex; align-items: center; gap: 6px; }
      #msg { min-height: 1.4em; color: #3a86ff; }
      input[type=file] { max-width: 100%; }
    </style>
  </head>
  <body>
    <h1>PlayBox admin</h1>
    <p class="sub">Publish, hide or remove games. Open from any device on your Wi-Fi: http://&lt;box-ip&gt;:8080/admin.html</p>

    <div class="card">
      <b>Publish a game</b>
      <p><small>Upload a game .zip (made by <code>npm run build:games</code>, found in <code>build/game-zips/</code>). Uploading a game with an existing id replaces it.</small></p>
      <input id="file" type="file" accept=".zip,application/zip" />
      <button id="upload">Upload</button>
      <div id="msg"></div>
    </div>

    <div class="card" id="list">Loading…</div>

    <script type="module" src="/src/admin.ts"></script>
  </body>
</html>
