    <title>Tracker Debug</title>
    <style>

      a { color: #ffbe0b; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">

      <label>Camera <select id="cams"><option value="">default</option></select></label>

    </div>

</html>
