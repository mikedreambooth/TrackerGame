<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracker Debug</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; color: #fff; font: 15px/1.4 ui-monospace, monospace; overflow: hidden; }
      canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
      #panel { position: fixed; top: 12px; left: 12px; background: rgba(0,0,0,.7); padding: 12px 14px; border-radius: 10px; min-width: 260px; }
      #panel select { max-width: 260px; }
      #log { margin-top: 8px; max-height: 40vh; overflow: hidden; color: #9f9; }
      a { color: #ffbe0b; }
      #version { margin-top: 6px; color: #ffbe0b; }
      #voice { margin-top: 4px; color: #8ecae6; }
      #voice button { margin-left: 6px; font: inherit; padding: 4px 10px; border-radius: 6px; border: 0; background: #8ecae6; color: #1b1030; font-weight: 700; }
      #version button { margin-left: 6px; font: inherit; padding: 4px 10px; border-radius: 6px; border: 0; background: #ffbe0b; color: #1b1030; font-weight: 700; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="panel">
      <div><b>Tracker debug</b> · <a href="./">launcher</a></div>
      <div id="version">version: …</div>
      <div id="voice">voice: …</div>
      <pre id="stats">starting…</pre>
      <label>Mounted <select id="rot"><option value="180">upside down (180°)</option><option value="0">right way up (0°)</option></select></label>
      <div id="log"></div>
    </div>
    <script type="module" src="/src/debug.ts"></script>
  </body>
</html>
