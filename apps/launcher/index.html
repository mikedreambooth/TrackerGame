<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackerGame</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="home">
      <header class="topbar">
        <h1>Play<span>Box</span></h1>
        <div id="players" class="players"></div>
      </header>
      <p id="hint" class="hint">Stand in front of the TV and raise a hand to choose a game</p>
      <div class="pager-wrap">
        <button id="prev" class="pager" data-pager="-1" aria-label="Previous games">◀</button>
        <section id="tiles" class="tiles"></section>
        <button id="next" class="pager" data-pager="1" aria-label="More games">▶</button>
      </div>
      <div id="dots" class="dots"></div>
    </main>
    <iframe id="game" class="game" title="game" allow="autoplay; encrypted-media; fullscreen" hidden></iframe>
    <!-- Simulator only: catches touches/mouse over a running game so they drive the
         fake player directly (relaying them out of the iframe is unreliable on iOS). -->
    <div id="simlayer" class="simlayer" hidden></div>
    <canvas id="overlay" class="overlay"></canvas>
    <div id="exit" class="exit" hidden>Going home…</div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
