<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TrackerGame</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main id="home">
      <header class="topbar">
        <h1>Play<span>Box</span></h1>
        <div id="players" class="players"></div>
      </header>
      <p id="hint" class="hint">Stand in front of the TV and raise a hand to choose a game</p>
      <section id="tiles" class="tiles"></section>
    </main>
    <iframe id="game" class="game" title="game" allow="autoplay" hidden></iframe>
    <canvas id="overlay" class="overlay"></canvas>
    <div id="exit" class="exit" hidden>Going home…</div>
    <div id="toast" class="toast" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
